<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vivero en 3D · Amazonía Emprende</title>
<meta name="description" content="Recorrido 3D del vivero de Amazonía Emprende: naves con polisombra, mesas de crecimiento y camas de germinación.">
<meta name="theme-color" content="#2f3f32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" href="vivero.glb" as="fetch" crossorigin>
<style>
  :root{
    --bone:#e4ded2; --forest:#2f3f32; --amber:#e1a644; --ink:#1e1a18;
    --vidrio:rgba(24,34,26,.6); --vidrio-borde:rgba(228,222,210,.18);
    --texto:#f3efe6; --tenue:rgba(243,239,230,.72);
    --fila1:max(12px,env(safe-area-inset-top));
    --fila2:calc(max(12px,env(safe-area-inset-top)) + 58px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a241c;color:var(--texto);
    font-family:Poppins,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  #lienzo{position:fixed;inset:0;touch-action:none}
  #lienzo canvas{display:block;outline:none}
  .vidrio{background:var(--vidrio);border:1px solid var(--vidrio-borde);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  button{font:inherit;color:inherit;cursor:pointer}
  [hidden]{display:none!important}

  /* fila de arriba */
  .cab{position:fixed;top:var(--fila1);left:16px;right:16px;display:flex;gap:10px;
    align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:6}
  .cab > *{pointer-events:auto}
  .titulo{padding:10px 14px;display:flex;gap:12px;align-items:center}
  .titulo a{color:var(--tenue);text-decoration:none;font-size:13px;white-space:nowrap}
  .titulo a:hover{color:var(--texto)}
  .titulo .sep{width:1px;height:22px;background:var(--vidrio-borde)}
  .titulo h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .titulo h1 small{display:block;font-size:11.5px;font-weight:400;color:var(--tenue)}
  .btn-cifras{padding:10px 14px;font-size:13px;font-weight:500;border-radius:14px}
  .btn-cifras[aria-expanded=true]{background:rgba(228,222,210,.88);color:var(--forest)}
  body.caminando .btn-cifras{visibility:hidden}

  /* hora arriba al centro */
  .hora{position:fixed;top:var(--fila1);left:50%;transform:translateX(-50%);z-index:6;
    display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px}
  .hora output{font-size:15px;font-weight:600;min-width:44px;text-align:center}
  .hora input{width:130px;accent-color:var(--amber)}
  .play{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--amber);color:var(--ink);
    display:flex;align-items:center;justify-content:center}
  .play svg{width:13px;height:13px}

  /* cifras en una línea */
  .tira{position:fixed;top:var(--fila2);right:16px;z-index:5;max-width:calc(100% - 32px);display:flex;align-items:center;
    gap:2px;padding:5px 6px 5px 12px;border-radius:12px;font-size:12px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;
    transition:opacity .25s,transform .25s}
  .tira::-webkit-scrollbar{display:none}
  .tira.oculta,body.caminando .tira{opacity:0;transform:translateY(-6px);pointer-events:none}
  .tira span{color:var(--tenue);padding:0 10px;border-right:1px solid var(--vidrio-borde)}
  .tira span:last-of-type{border-right:0}
  .tira b{color:var(--texto);font-weight:600}
  .tira button{background:none;border:0;color:var(--tenue);font-size:17px;line-height:1;padding:2px 6px}
  .tira button:hover{color:var(--texto)}

  /* barra izquierda: información del punto */
  .izq{position:fixed;left:16px;top:calc(var(--fila2) + 4px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 92px);width:290px;
    padding:18px;z-index:5;display:flex;flex-direction:column;overflow:auto;font-size:13px;line-height:1.5;transition:opacity .3s,transform .3s}
  .izq.cerrada{opacity:0;transform:translateX(-24px);pointer-events:none}
  .izq .cab-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .izq .cab-info span{font-size:11.5px;color:var(--tenue)}
  .izq .cerrar{background:none;border:0;font-size:20px;line-height:1;color:var(--tenue);padding:2px 4px}
  .izq h3{margin:0 0 8px;font-size:18px;font-weight:600;color:var(--amber)}
  .izq .desc{margin:0 0 14px}
  .acercar{align-self:flex-start;border:1px solid var(--vidrio-borde);background:rgba(255,255,255,.06);border-radius:10px;
    padding:8px 12px;font-size:12.5px}
  .acercar:hover{background:rgba(255,255,255,.12)}
  .indice{list-style:none;margin:auto 0 0;padding:14px 0 0;border-top:1px solid var(--vidrio-borde);display:grid;gap:2px}
  .indice button{width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:7px 8px;display:flex;gap:10px;
    align-items:center;font-size:13px;color:var(--tenue)}
  .indice button:hover{background:rgba(255,255,255,.06);color:var(--texto)}
  .indice button[aria-current=true]{background:rgba(225,166,68,.16);color:var(--texto)}
  .indice i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;
    align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}

  /* guía del recorrido (modo caminar) */
  .guia{position:fixed;top:var(--fila2);left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;
    padding:8px 16px 8px 8px;border-radius:999px;max-width:calc(100% - 32px)}
  .guia .flecha{flex:none;width:38px;height:38px;border-radius:50%;background:var(--amber);color:var(--ink);
    display:flex;align-items:center;justify-content:center}
  .guia .flecha svg{width:20px;height:20px;transition:transform .08s linear}
  .guia .txt{min-width:0}
  .guia .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .guia .s{font-size:12px;color:var(--tenue)}
  .guia .otra{flex:none;border:1px solid var(--vidrio-borde);background:rgba(255,255,255,.08);border-radius:999px;padding:6px 12px;font-size:12px}
  .guia .otra:hover{background:rgba(255,255,255,.16)}
  .guia.completo .flecha svg{transform:none!important}

  /* barra de vistas */
  .barra{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));
    display:flex;gap:4px;padding:5px;z-index:5;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
  .barra::-webkit-scrollbar{display:none}
  .barra button{background:none;border:0;padding:9px 13px;border-radius:10px;font-size:13px;white-space:nowrap;color:var(--tenue)}
  .barra button:hover{color:var(--texto);background:rgba(255,255,255,.06)}
  .barra button[aria-pressed=true]{background:var(--bone);color:var(--forest);font-weight:500}
  .barra .div{width:1px;margin:6px 2px;background:var(--vidrio-borde);flex:none}
  .barra .caminar[aria-pressed=true]{background:var(--amber);color:var(--ink)}
  .ayuda{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 58px);
    font-size:12px;color:var(--tenue);text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:4;white-space:nowrap;pointer-events:none}
  body.mouse-libre .ayuda{color:var(--texto);font-size:13px;font-weight:500}

  /* mira al centro mientras el mouse controla la vista */
  .mira{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    background:rgba(243,239,230,.85);box-shadow:0 0 0 1.5px rgba(0,0,0,.35);z-index:3;display:none;pointer-events:none}
  body.caminando:not(.mouse-libre):not(.tactil) .mira{display:block}

  /* números en la escena */
  .punto{position:fixed;left:0;top:0;z-index:3;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
    border:2px solid var(--bone);background:rgba(47,63,50,.82);color:var(--bone);font-size:13px;font-weight:600;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:opacity .25s,background .2s}
  .punto:hover,.punto.activo{background:var(--amber);color:var(--ink);border-color:var(--amber)}
  .punto.lejos{opacity:0;pointer-events:none}
  .punto.visto:not(.activo){border-color:var(--amber)}
  body.caminando .punto{pointer-events:none}
  body.caminando .punto.activo{animation:latido 1.4s ease-in-out infinite}
  @keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(225,166,68,.55)}50%{box-shadow:0 0 0 10px rgba(225,166,68,0)}}

  /* tarjeta del recorrido: explicación al llegar y aviso de a dónde ir */
  .tarjeta{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px);transform:translateX(-50%);
    width:min(480px,calc(100% - 32px));padding:18px 20px;z-index:7;font-size:14px;line-height:1.55;
    animation:sube .45s ease-out}
  @keyframes sube{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
  .tarjeta .tn{font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
  .tarjeta h3{margin:0 0 6px;font-size:19px;font-weight:600}
  .tarjeta p{margin:0}
  .tarjeta .pie{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
  .tarjeta .pie span{font-size:11.5px;color:var(--tenue)}
  .listo{border:0;border-radius:12px;background:var(--amber);color:var(--ink);font-weight:600;padding:11px 18px;font-size:14px}
  .listo:hover{background:#eab357}
  body.caminando .hora{display:none}
  body.caminando .guia{top:var(--fila1)}
  body.caminando .titulo h1 small{display:none}
  @media (max-width:1060px){ body.caminando .guia{top:calc(var(--fila1) + 56px)} }
  body.cine .ayuda,body.cine .mira,body.cine .palanca{display:none!important}
  body.cine .barra{opacity:.35;pointer-events:none}

  /* palanca táctil */
  .palanca{position:fixed;left:24px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 76px);width:112px;height:112px;
    border-radius:50%;z-index:5;display:none;touch-action:none}
  .palanca.on{display:block}
  .palanca i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:var(--bone);opacity:.85}

  /* carga */
  .carga{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#1a241c;transition:opacity .6s}
  .carga.fin{opacity:0;pointer-events:none}
  .carga .barra-carga{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
  .carga .barra-carga i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
  .carga span{font-size:13px;color:var(--tenue)}
  .carga.error span{color:#f0b3a8}

  @media (max-width:980px){
    .titulo h1 small{display:none}
    .hora input{width:90px}
  }
  @media (max-width:820px){
    :root{--fila2:calc(max(12px,env(safe-area-inset-top)) + 104px)}
    .hora{top:calc(var(--fila1) + 52px)}
    body.caminando .guia{top:calc(var(--fila1) + 52px)}
    .izq{top:auto;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 62px);right:16px;width:auto;max-height:52vh}
    .izq.cerrada{transform:translateY(16px)}
    .indice{display:none}
    .ayuda{white-space:normal;text-align:center;width:calc(100% - 32px)}
  }
  @media (max-width:520px){
    .titulo a span{display:none}
    .barra{gap:2px;padding:4px}
    .barra button{padding:9px 10px;font-size:12.5px}
    .solo-escritorio{display:none}
    .tira{left:16px;right:auto}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="lienzo" aria-label="Modelo 3D del vivero"></div>

<header class="cab">
  <div class="titulo vidrio">
    <a href="/" title="Volver a Amazonía Emprende">← <span>Amazonía Emprende</span></a>
    <div class="sep"></div>
    <h1>Vivero en 3D<small>Recorrido por las naves de producción</small></h1>
  </div>
  <button class="btn-cifras vidrio" id="btnCifras" aria-expanded="true" aria-controls="tira">Cifras</button>
</header>

<div class="hora vidrio" role="group" aria-label="Hora del día">
  <button class="play" id="play" aria-label="Pausar" aria-pressed="true">
    <svg viewBox="0 0 16 16" id="icoPlay" hidden><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
    <svg viewBox="0 0 16 16" id="icoPausa"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/></svg>
  </button>
  <output id="horaTxt">7:30</output>
  <input type="range" id="hora" min="6" max="18" step="0.05" value="7.5" aria-label="Hora del día">
</div>

<div class="tira vidrio" id="tira" aria-label="Cifras del vivero"><button id="tiraCerrar" aria-label="Esconder cifras" title="Esconder">×</button></div>

<aside class="izq vidrio cerrada" id="info" aria-label="Información del punto" aria-hidden="true">
  <div class="cab-info"><span id="infoN"></span><button class="cerrar" id="infoCerrar" aria-label="Cerrar">×</button></div>
  <h3 id="infoT"></h3>
  <p class="desc" id="infoP"></p>
  <button class="acercar" id="infoAcercar">Ver de cerca</button>
  <ol class="indice" id="indice"></ol>
</aside>

<div class="guia vidrio" id="guia" hidden aria-live="polite">
  <div class="flecha"><svg viewBox="0 0 20 20" id="flecha"><path d="M10 2l6 13-6-3.2L4 15z" fill="currentColor"/></svg></div>
  <div class="txt"><div class="t" id="guiaT"></div><div class="s" id="guiaS"></div></div>
  <button class="otra" id="guiaDonde">¿Dónde queda?</button>
  <button class="otra" id="guiaOtra" hidden>Otra vez</button>
</div>

<nav class="barra vidrio" id="barra" aria-label="Vistas">
  <button data-vista="aerea" aria-pressed="true">Aérea</button>
  <button data-vista="entrada" aria-pressed="false">Entrada</button>
  <button data-vista="mesas" aria-pressed="false">Mesas</button>
  <button data-vista="camas" aria-pressed="false">Camas</button>
  <button data-vista="planta" aria-pressed="false" class="solo-escritorio">Planta</button>
  <span class="div"></span>
  <button class="caminar" id="btnCaminar" aria-pressed="false">Caminar</button>
</nav>
<div class="ayuda" id="ayuda"></div>
<div class="mira"></div>

<div class="palanca vidrio" id="palanca"><i></i></div>
<div id="puntos"></div>
<div class="tarjeta vidrio" id="tarjeta" hidden role="dialog" aria-live="polite">
  <div class="tn" id="tarjetaN"></div>
  <h3 id="tarjetaT"></h3>
  <p id="tarjetaP"></p>
  <div class="pie" id="tarjetaPie"><span>o presiona Enter</span><button class="listo" id="tarjetaOk">Entendido, seguir</button></div>
</div>

<div class="carga" id="carga"><div class="barra-carga"><i id="cargaBarra"></i></div><span id="cargaTxt">Cargando el vivero…</span></div>

<script type="module" src="vivero.js"></script>
</body>
</html>
